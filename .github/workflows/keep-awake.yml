# Render's free plan puts the SmartToll service to sleep after 15 minutes without visitors, and
# the next visitor then waits about a minute. This opens the health page every 10 minutes so it
# stays awake (one service running all month fits in Render's 750 free hours).
#
# Needs the repository variable SITE_URL (Settings → Secrets and variables → Actions → Variables),
# e.g. https://smarttoll.onrender.com. GitHub may run it a few minutes late; that's fine.
name: Keep awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ vars.SITE_URL != '' }}
    steps:
      - name: Open the health page
        run: curl --silent --show-error --fail --retry 3 --retry-delay 20 --max-time 120 "${{ vars.SITE_URL }}/up" -o /dev/null
