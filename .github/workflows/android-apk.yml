# Builds the SmartToll Android APK on GitHub's servers with EAS "local" builds:
# free (no EAS cloud build minutes), signed with the same keystore stored on Expo,
# so Google sign-in keeps working. Run it from the repo's Actions tab → "Android APK"
# → Run workflow; the APK is attached to the run as "SmartToll-apk" (about 20 minutes).
#
# Needs one repository secret: EXPO_TOKEN (expo.dev → Account settings → Access tokens).
name: Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: smarttoll/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: smarttoll/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner already has the Android SDK (ANDROID_HOME); just make sure it's on the PATH.
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      # Gradle settings for this machine (they take priority over the project's): more memory than
      # the template's 512 MB Metaspace (the build ran out), and phone CPUs only (no emulator x86
      # builds), which roughly halves the native compiling.
      - name: Gradle settings
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
          org.gradle.parallel=true
          reactNativeArchitectures=arm64-v8a,armeabi-v7a
          PROPS
          cat ~/.gradle/gradle.properties

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        run: npm ci

      - name: Build the APK (preview profile, Railway API)
        run: eas build --platform android --profile preview --local --non-interactive --output "$GITHUB_WORKSPACE/SmartToll.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SmartToll-apk
          path: SmartToll.apk
          retention-days: 30
